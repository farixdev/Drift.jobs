<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B9DFF"/>
      <stop offset="0.55" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0060E6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#003C87" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- iOS-style rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sheen)"/>

  <!-- drift trail -->
  <g fill="#FFFFFF">
    <circle cx="150" cy="366" r="12" opacity="0.30"/>
    <circle cx="196" cy="392" r="9"  opacity="0.20"/>
  </g>

  <!-- paper plane -->
  <g filter="url(#soft)">
    <!-- lower/underside facet (dimmer fold) -->
    <path d="M398 132 L250 300 L250 402 Z" fill="#FFFFFF" fill-opacity="0.72"/>
    <!-- top facet (bright) -->
    <path d="M398 132 L132 250 L250 300 Z" fill="#FFFFFF"/>
  </g>
</svg>
